# EXAMPLE ONLY. Prefer `kubectl create secret generic` or an external secret
# manager; never commit real values. The DSNs omit the password on purpose so
# the secret scanner stays clean; add it when seeding the real Secret.
apiVersion: v1
kind: Secret
metadata:
  name: adk-agent-secrets
type: Opaque
stringData:
  ADK_MCP_AUTH_TOKEN: "replace-me"
  ANTHROPIC_AUTH_TOKEN: "replace-me"
  SESSION_URL: "postgresql+asyncpg://adk@postgres:5432/adk"
  REGISTRY_DATABASE_URL: "postgresql://adk@postgres:5432/adk"
  ARTIFACT_URL: "postgresql://adk@postgres:5432/adk"
  GRANT_URL: "postgresql://adk@postgres:5432/adk"
  AUDIT_DATABASE_URL: "postgresql://adk@postgres:5432/adk"
  APPROVAL_DATABASE_URL: "postgresql://adk@postgres:5432/adk"
  QUOTA_URL: "postgresql://adk@postgres:5432/adk"
  RATE_LIMIT_URL: "redis://redis:6379/0"
  ADK_AUDIT_KEYRING: '{"active":"<replace-me>","keys":{"<replace-me>":"<hex key>"}}'
  ADK_ARTIFACT_KEYS: '{"<replace-me>":"<64 hex public key>"}'
