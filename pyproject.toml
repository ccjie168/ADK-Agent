[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-agent"
version = "0.1.0"
description = "Reusable multi-agent application framework on Google ADK with bidirectional MCP integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk[mcp]>=2.0,<3",
]

[project.optional-dependencies]
# Must stay inside the range ADK's own `extensions` extra declares.
litellm = ["litellm>=1.84,<1.106.3"]
gemini = ["google-genai>=2.0"]
claude = ["anthropic>=0.78"]
http = ["uvicorn>=0.30"]
oidc = ["PyJWT[crypto]>=2,<3"]
publish = ["cryptography>=42"]
redis = ["redis>=5"]
dev = [
    "pytest>=8.0",
    "ruff",
    "mypy",
    "pip-audit",
    "detect-secrets",
    "bandit",
    "import-linter>=2.0",
]

[project.scripts]
adk-agent = "adk_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
files = ["src"]
