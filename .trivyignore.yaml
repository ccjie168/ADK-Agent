  - id: CVE-2026-112940
    statement: >-
      litellm 1.106.2 requires filelock<4.0; the fixed filelock 4.2.1 is only
      reachable via litellm>=1.109.2, but the project pins litellm<1.106.3
      (ADK's cap to avoid the compromised 1.107.0 release; ADK 2.15.0 still
      caps it). So filelock cannot be upgraded without overriding the pin.
      Revisit when ADK raises the litellm range. The app does not call
      filelock directly.
    expired_at: 2027-05-01
  - id: CVE-2025-47273
    statement: >-
      setuptools 70.3.0 exists only in a base-image layer that a later layer
      deletes. The merged filesystem has no setuptools, pip cannot show it,
      and the app cannot import it.
    expired_at: 2027-05-01
