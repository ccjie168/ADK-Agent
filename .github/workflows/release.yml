name: release

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Registry image without a tag, e.g. registry.local:5000/adk/adk-agent"
        required: true
      runner:
        description: "Runner label that can reach the registry"
        required: false
        default: ubuntu-latest
      tag:
        description: "Image tag, defaults to the commit SHA"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    env:
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python scripts/check.py --full --strict
      - run: python scripts/release_digest.py --image "$IMAGE" --validate
      - run: docker build -t "adk-agent:$GITHUB_SHA" .
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.2
      - run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore.yaml "adk-agent:$GITHUB_SHA"
      - name: push
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_USERNAME:-}" ] || [ -z "${REGISTRY_PASSWORD:-}" ]; then
            echo "REGISTRY_USERNAME and REGISTRY_PASSWORD must be set" >&2
            exit 1
          fi
          REGISTRY="${IMAGE%%/*}"
          TAG="${TAG:-$GITHUB_SHA}"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          docker tag "adk-agent:$GITHUB_SHA" "$IMAGE:$TAG"
          PUSH_OUT=$(docker push "$IMAGE:$TAG")
          echo "$PUSH_OUT"
          DIGEST=$(printf '%s\n' "$PUSH_OUT" | awk '/digest: sha256:/ {print $3; exit}')
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "no digest in the push output" >&2; exit 1 ;;
          esac
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee release.txt
          {
            echo "### Release digest"
            echo
            echo '```'
            cat release.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release
          path: release.txt
