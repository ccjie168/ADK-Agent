name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python scripts/check.py --full --strict
      - run: docker build -t adk-agent:${{ github.sha }} .
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.2
      - run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
          --ignorefile .trivyignore.yaml adk-agent:${{ github.sha }}
      - run: python scripts/sbom.py -o sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom.json
