services:
  adk-agent:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ADK_AGENT_MODEL: "claude:deepseek-v4-pro"
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      SESSION_DB: "/data/sessions.db"
      ADK_MCP_AUTH_TOKEN: "${ADK_MCP_AUTH_TOKEN:?set ADK_MCP_AUTH_TOKEN}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:?set ANTHROPIC_AUTH_TOKEN}"
    volumes:
      - adk-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/healthz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adk-console:
    build: .
    entrypoint: ["python", "-m", "adk_agent"]
    command: ["console", "--agents", "examples/minimal/agent.py", "--host", "0.0.0.0"]
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      ADK_AGENT_MODEL: "claude:deepseek-v4-pro"
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      SESSION_DB: "/data/console.db"
      ADK_MCP_AUTH_TOKEN: "${ADK_MCP_AUTH_TOKEN:?set ADK_MCP_AUTH_TOKEN}"
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:?set ANTHROPIC_AUTH_TOKEN}"
    volumes:
      - adk-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/healthz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  adk-data:
